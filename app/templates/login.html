{% extends "base.html" %}

{% block content %}
<h1>Login</h1>

<form method="POST" action="{{ url_for('main.login')}} ">
    <label>Username</label>
    <input type="text"
           name="username"
           placeholder="Username"
           class="form-input"
           required
    >
    <label>Password</label>
    <input type="password"
           name="password"
           placeholder="Password"
           class="form-input"
           required>
    <button type="submit">Login</button>
</form>
{% endblock %}
