{% extends "base.html" %}
{% block title %}Create League — FIFA Tracker{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h1 class="auth-title">New <span>League</span></h1>
    <p class="auth-sub">// you'll be added automatically</p>

    <form method="POST" action="{{ url_for('main.create_league') }}">
      <div class="form-group">
        <label class="form-label" for="name">League Name</label>
        <input
          id="name"
          type="text"
          name="name"
          placeholder="e.g. Sunday Madness FC"
          class="form-input"
          maxlength="120"
          autofocus
          required
        >
        <span class="form-hint">Max 120 characters · must be unique</span>
      </div>

      <button type="submit" class="btn btn--primary">Create League →</button>
    </form>

    <p class="auth-footer">
      <a href="{{ url_for('main.find_league') }}">← Back to Browse</a>
    </p>
  </div>
</div>
{% endblock %}
